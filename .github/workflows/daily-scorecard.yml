name: Daily Scorecard

# Fires on a cron in GitHub's cloud, whether your computer is on or off.
# 13:00 UTC = 08:00 ET (after prior US close, before next open). Adjust as you like.
on:
  schedule:
    - cron: "0 13 * * 1-5"   # Mon-Fri 13:00 UTC
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scorecard and send text
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          # Delivery (set the group you use as repo secrets):
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/scorecard.py --top 12 --max-weight 0.25

      - name: Save report as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

# (registered via push)
