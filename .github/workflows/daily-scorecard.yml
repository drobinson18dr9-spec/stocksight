name: Daily Scorecard

# Fires on a cron in GitHub's cloud, whether your computer is on or off.
# 13:00 UTC = 09:00 ET (after prior US close). Adjust as you like.
on:
  schedule:
    # Three cadences, each posts its own labeled Slack summary (unique minutes so
    # github.event.schedule maps cleanly to a label). 15:00 UTC = 08:00 PDT.
    - cron: "0 15 * * 1-5"     # Daily  (Mon-Fri): fast 1mo/3mo momentum + news
    - cron: "30 15 * * 1"      # Weekly (Mon): portfolio rebalance view
    - cron: "0 16 1 * *"       # Monthly (1st): longer-horizon review
  workflow_dispatch:
    inputs:
      cadence:
        description: "Cadence label (Daily / Weekly / Monthly)"
        default: "Daily"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Verify math (formula test suite, fails the run on any mismatch)
        run: python src/verify.py

      - name: Determine cadence from the schedule that fired
        id: cad
        run: |
          case "${{ github.event.schedule }}" in
            "30 15 * * 1") C=Weekly ;;
            "0 16 1 * *")  C=Monthly ;;
            "0 15 * * 1-5") C=Daily ;;
            *) C="${{ github.event.inputs.cadence || 'Daily' }}" ;;
          esac
          echo "cadence=$C" >> "$GITHUB_OUTPUT"
          # Texts go out ONLY on the Weekly run. Daily/Monthly runs still compute
          # the math, refresh reports, and redeploy the dashboard, silently.
          if [ "$C" = "Weekly" ]; then NOTIFY=""; else NOTIFY="--no-notify"; fi
          echo "notify_flag=$NOTIFY" >> "$GITHUB_OUTPUT"
          echo "Cadence: $C (notify: ${NOTIFY:-on})"

      - name: Run scorecard and send alert text
        env:
          # A2P approved 2026-06: Twilio is primary (delivers SMS), Slack is the fallback.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/scorecard.py --multi --top 12 --max-weight 0.25 --cadence "${{ steps.cad.outputs.cadence }}" ${{ steps.cad.outputs.notify_flag }}

      - name: Refresh forecasts daily (portfolio + top names; full universe stays weekly)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python src/build_explorer.py

      - name: Build interactive dashboard
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python src/dashboard.py

      - name: Upload site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
